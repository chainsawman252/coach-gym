<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Iniciar Sesión')}"></head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">
<div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-3">
        <h3 class="fw-bold">🏋️ COACH GYM</h3>
        <p class="text-muted small">Sistema de Gestión y Control de Acceso</p>
    </div>
    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
    <form method="post" action="/login">
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control" placeholder="admin o recepcion" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" placeholder="••••••" required>
        </div>
        <button type="submit" class="btn btn-warning w-100 fw-bold">Ingresar</button>
    </form>
</div>
</body>
</html>
