<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | Coach Gym'">Coach Gym</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="/">🏋️ COACH GYM</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuGym">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuGym">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/clientes">Clientes & QR</a></li>
                <li class="nav-item"><a class="nav-link" href="/pagos">Pagos</a></li>
                <li class="nav-item"><a class="nav-link" href="/asistencia">Asistencia (Escáner)</a></li>
                <li class="nav-item"><a class="nav-link" href="/reservas">Reservas</a></li>
                <!-- Solo visible para ADMIN -->
                <li class="nav-item" th:if="${session.rol == 'ADMIN'}">
                    <a class="nav-link text-warning fw-semibold" href="/admin/panel">⚙️ Administración</a>
                </li>
            </ul>
            <div class="d-flex align-items-center text-white gap-3">
                <span class="badge bg-secondary" th:text="${session.usuarioLogueado} + ' (' + ${session.rol} + ')'"></span>
                <a href="/logout" class="btn btn-outline-light btn-sm">Salir</a>
            </div>
        </div>
    </div>
</nav>
<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
